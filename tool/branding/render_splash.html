<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    width: 1152px; height: 1152px;
    display: flex; align-items: center; justify-content: center;
  }
  svg { display: block; width: 760px; height: 760px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="760" height="760">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="45%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Logo penuh, 66% dari kanvas 1152 agar aman dari circle-mask Android 12 -->
  <rect x="36" y="44" width="440" height="440" rx="116" fill="#1E1B4B" fill-opacity="0.25"/>
  <rect x="36" y="36" width="440" height="440" rx="116" fill="url(#bgGrad)"/>
  <rect x="40" y="40" width="432" height="432" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
  <circle cx="256" cy="256" r="135" fill="none" stroke="url(#orbitGrad)" stroke-width="28" stroke-linecap="round" stroke-dasharray="640 180" transform="rotate(-30 256 256)"/>
  <path d="M165 264 L232 331 L352 192" fill="none" stroke="url(#checkGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="355" cy="185" r="14" fill="#38BDF8"/>
</svg>
</body>
</html>
